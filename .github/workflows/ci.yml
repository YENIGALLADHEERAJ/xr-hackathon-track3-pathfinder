name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contract tests (one pose per row, formats, failure rows, dropouts)
        run: python tools/test_contract.py
      - name: Budgets on a simulated degraded run (heap <= 8 MB, <= 20 ms per IMU-second)
        run: |
          pip install numpy
          python tools/simulate.py /tmp/sim_mav --profile mav --seed 11 --failure nan
          python src/main.py /tmp/sim_mav -o /tmp/est.txt --metadata /tmp/meta.json --profile-memory
          python src/main.py /tmp/sim_mav -o /tmp/est.txt --metadata /tmp/meta_t.json
          python - <<'EOF'
          import json
          m = json.load(open("/tmp/meta.json"))
          t = json.load(open("/tmp/meta_t.json"))
          heap = m["python_peak_heap_bytes"] / 2 ** 20
          assert heap <= 8.0, heap
          assert t["runtime_ms_per_imu_second"] <= 20.0, t["runtime_ms_per_imu_second"]
          print("budgets OK: heap %.2f MB, %.3f ms per IMU-second" % (heap, t["runtime_ms_per_imu_second"]))
          EOF
      - name: Docker image builds and gives the same trajectory
        run: |
          docker build -t pathfinder .
          docker run --rm -v /tmp/sim_mav:/data pathfinder /data -o /data/est_docker.txt
          python - <<'EOF'
          # container libm may differ from the runner's in the last ulp:
          # require identical rows and timestamps, numbers within 1e-4
          a = [l.split() for l in open("/tmp/est.txt") if not l.startswith("#")]
          b = [l.split() for l in open("/tmp/sim_mav/est_docker.txt") if not l.startswith("#")]
          assert len(a) == len(b), (len(a), len(b))
          assert all(x[0] == y[0] for x, y in zip(a, b)), "timestamps differ"
          d = max(abs(float(u) - float(v)) for x, y in zip(a, b) for u, v in zip(x[1:], y[1:]))
          assert d < 1e-4, d
          print("docker output matches (%d rows, max diff %.1e)" % (len(a), d))
          EOF

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contract tests
        run: python tools/test_contract.py
